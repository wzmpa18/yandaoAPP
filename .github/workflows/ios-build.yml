name: iOS & Android Build

on:
  push:
    branches: [ main, new_main, master ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Build web
      run: |
        node -v && npm -v
        npm ci
        npm run build || npx vite build

    - name: Install Capacitor CLI & Sync
      run: |
        npm install -g @capacitor/cli
        npx cap sync android || true

    - name: Fix gradlew permission & Build APK
      run: |
        cd android
        # 确保执行权限
        chmod +x gradlew
        ls -la gradlew
        # 使用 gradle wrapper 自带 JDK，不依赖外部 Gradle
        ./gradlew assembleRelease --no-daemon --warning-mode all 2>&1 | tail -50
        echo "=== BUILD EXIT CODE: $? ==="

    - name: Find and list APKs
      if: always()
      run: |
        echo "=== Looking for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null
        ls -la android/app/build/outputs/apk/release/ 2>/dev/null || echo "Release dir not found"
        ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug dir not found"

    - name: Upload APK artifact (release)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: yandao-android-release.apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30
      continue-on-error: true

    - name: Upload APK artifact (debug, fallback)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: yandao-android-debug.apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
      continue-on-error: true

    - name: Upload to Cloudflare R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: |
        pip3 install awscli --quiet --break-system-packages 2>/dev/null || pip3 install awscli --quiet
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BUCKET="${{ secrets.R2_BUCKET }}"
        ENDPOINT="https://${{ secrets.R2_ENDPOINT }}.r2.cloudflarestorage.com"
        for apk in $(find android -name "*.apk" -type f 2>/dev/null); do
          NAME="yandao-${TIMESTAMP}-$(basename "$apk")"
          aws s3 cp "$apk" "s3://$BUCKET/android/$NAME" \
            --endpoint-url "$ENDPOINT" && echo "✅ Uploaded $NAME" || echo "⚠️ Failed $NAME"
        done || echo "R2 upload skipped (no credentials)"

  ios-build:
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies & Build Web
      run: |
        npm ci
        npm run build || npx vite build

    - name: Install Capacitor & Sync iOS
      run: |
        npm install -g @capacitor/cli
        npx cap sync ios || true
        
    - name: Install CocoaPods
      run: gem install cocoapods --no-document
      
    - name: Install pods
      run: |
        cd ios/App 2>/dev/null && pod install --repo-update && cd ../.. || \
        cd ios && pod install --repo-update || echo "No Podfile"
        
    - name: Build iOS (unsigned, no signing certs needed)
      run: |
        # 尝试无签名构建 iOS app (仅用于验证构建)
        xcodebuild -workspace ios/App/App.xcworkspace \
          -scheme App -sdk iphoneos -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath build/ios-derived \
          build 2>&1 | tail -40 || {
          echo "=== iOS build failed (expected without signing certs) ==="
          # 尝试模拟器构建
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            build 2>&1 | tail -40 || echo "Simulator build also failed"
        }
        
    - name: Find iOS build products
      if: always()
      run: |
        echo "=== iOS build outputs ==="
        find build/ios-derived -name "*.app" -type d 2>/dev/null || echo "No .app found"
        find build/ios-derived -name "*.ipa" -type f 2>/dev/null || echo "No .ipa found"
        
    - name: Package .app into .ipa (unsigned)
      if: always()
      run: |
        APP_PATH=$(find build/ios-derived -name "*.app" -type d 2>/dev/null | head -1)
        if [ -n "$APP_PATH" ]; then
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r ../yandao-unsigned.ipa Payload/ && cd ../..
          echo "✅ Created unsigned IPA"
        else
          echo "⚠️ No .app found to package"
        fi
      
    - name: Upload iOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: yandao-ios-build
        path: |
          build/yandao-unsigned.ipa
          build/ios-derived/**/*.app
        retention-days: 30
      continue-on-error: true
