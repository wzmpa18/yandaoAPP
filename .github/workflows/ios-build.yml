name: iOS & Android Build

on:
  push:
    branches: [ main, new_main, master ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        node -v && npm -v
        npm install 2>&1
        echo "=== Install exit code: $? ==="
        ls node_modules/.bin/vite 2>&1 || echo "vite NOT in .bin"
        ls node_modules/vite 2>&1 || echo "vite NOT in node_modules"

    - name: Build web
      run: |
        set +e
        echo "=== Trying npm run build ==="
        npm run build 2>&1
        RC=$?
        echo "=== npm run build exit: $RC ==="
        if [ $RC -ne 0 ]; then
          echo "=== Falling back to npx vite build ==="
          npx --yes vite build 2>&1
          echo "=== npx vite build exit: $? ==="
        fi

    - name: Install Capacitor CLI & Sync
      run: |
        echo "=== Node version ==="
        node -v && npm -v
        echo "=== Check package.json capacitor deps ==="
        node -e "const p=require('./package.json'); console.log('cap deps:', JSON.stringify(Object.keys(p.devDependencies||{}).filter(k=>k.includes('capacitor'))))"
        echo "=== Install Capacitor deps ==="
        npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android 2>&1 || {
          echo "WARNING: npm install capacitor failed, trying npx..."
        }
        echo "=== Check capacitor CLI ==="
        ls -la node_modules/.bin/cap 2>&1 || echo "cap not in .bin"
        ls -la node_modules/@capacitor/cli 2>&1 || echo "cli not in node_modules"
        echo "=== Running cap sync android ==="
        # Use node_modules/.bin/cap directly to avoid npx issues
        if [ -f node_modules/.bin/cap ]; then
          node_modules/.bin/cap sync android 2>&1 || {
            echo "WARNING: cap sync failed"
            echo "=== Trying npx cap add android ==="
            npx --yes @capacitor/cli add android 2>&1 || echo "cap add failed"
            echo "=== Trying npx cap sync android ==="
            npx --yes @capacitor/cli sync android 2>&1 || echo "cap sync still failing"
          }
        else
          echo "=== Using npx to sync ==="
          npx --yes @capacitor/cli sync android 2>&1 || {
            npx --yes @capacitor/cli add android 2>&1
            npx --yes @capacitor/cli sync android 2>&1
          }
        fi
        echo "=== Android project structure ==="
        ls -la android/app/build.gradle 2>/dev/null && echo "build.gradle OK" || echo "build.gradle MISSING"
        ls -la android/gradlew 2>/dev/null && echo "gradlew OK" || echo "gradlew MISSING"
        ls -la android/app/src/main/ 2>/dev/null || echo "android src dir not found"

    - name: Fix gradlew permission & Build APK
      run: |
        echo "=== Android dir contents ==="
        ls -la android/
        cd android
        chmod +x gradlew
        ls -la gradlew
        echo "=== Building Release APK ==="
        ./gradlew assembleRelease --no-daemon --warning-mode all 2>&1 | tail -100 || true
        echo "=== Gradle exit: checking for APKs ==="
        find . -name "*.apk" -type f -ls 2>/dev/null
        if ! find . -name "*.apk" -type f 2>/dev/null | grep -q .; then
          echo "=== No release APK, trying debug build ==="
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50 || true
        fi
        echo "=== All APK files ==="
        find . -name "*.apk" -type f -ls 2>/dev/null || echo "No APKs found"

    - name: Find and list APKs
      if: always()
      run: |
        echo "=== Looking for APK files ==="
        echo "--- Release ---"
        find android -path "*/release/*.apk" -type f -ls 2>/dev/null || echo "No release APK"
        echo "--- Debug ---"
        find android -path "*/debug/*.apk" -type f -ls 2>/dev/null || echo "No debug APK"
        echo "--- All ---"
        find . -name "*.apk" -type f -ls 2>/dev/null || echo "No APK found anywhere"

    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: yandao-android-apk
        path: |
          android/app/build/outputs/apk/release/*.apk
          android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
      continue-on-error: true

    - name: Enable R2 Public Access (via CF API)
      if: success()
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: |
        # Enable R2 public access so users can download APK/IPA via r2.dev domain
        echo "=== Enabling R2 Public Access ==="
        ACCOUNT_ID="${{ secrets.R2_ENDPOINT }}"
        BUCKET="${{ secrets.R2_BUCKET }}"

        # Try to enable managed domain for public access
        curl -s -X PUT \
          "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets/$BUCKET/domains/managed" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"enabled": true}' | head -c 500 || true

        # Also try the public-access endpoint
        curl -s -X POST \
          "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets/$BUCKET/public-access" \
          -H "Authorization: Bearer $CF_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"enabled": true}' | head -c 500 || true

        echo "R2 public access configuration attempted."
        echo "Download URL will be: https://$BUCKET.$ACCOUNT_ID.r2.dev/android/yandao-latest.apk"
      continue-on-error: true

    - name: Upload to Cloudflare R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: |
        pip3 install awscli --quiet --break-system-packages 2>/dev/null || pip3 install awscli --quiet
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BUCKET="${{ secrets.R2_BUCKET }}"
        ENDPOINT="https://${{ secrets.R2_ENDPOINT }}.r2.cloudflarestorage.com"
        UPLOADED=false
        for apk in $(find android -name "*.apk" -type f 2>/dev/null); do
          SIZE=$(stat -c%s "$apk" 2>/dev/null || echo 0)
          echo "Found APK: $apk ($SIZE bytes)"
          # 带时间戳版本
          NAME="yandao-${TIMESTAMP}-$(basename "$apk")"
          aws s3 cp "$apk" "s3://$BUCKET/android/$NAME" \
            --endpoint-url "$ENDPOINT" && echo "Uploaded $NAME" || echo "Failed $NAME"
          # 固定latest版本（供下载页直接引用）
          aws s3 cp "$apk" "s3://$BUCKET/android/yandao-latest.apk" \
            --endpoint-url "$ENDPOINT" && echo "Updated yandao-latest.apk" || echo "Failed latest"
          # 同时上传到根目录（兼容旧下载页链接 /app-release.apk）
          aws s3 cp "$apk" "s3://$BUCKET/app-release.apk" \
            --endpoint-url "$ENDPOINT" && echo "Updated app-release.apk (root)" || echo "Failed root"
          UPLOADED=true
        done
        if [ "$UPLOADED" = false ]; then
          echo "WARNING: No APK files found to upload!"
        fi

    - name: Upload web dist to Cloudflare R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: |
        BUCKET="${{ secrets.R2_BUCKET }}"
        ENDPOINT="https://${{ secrets.R2_ENDPOINT }}.r2.cloudflarestorage.com"
        echo "=== Checking dist directory ==="
        ls -la dist/ 2>/dev/null || echo "dist/ NOT FOUND!"
        ls -la dist/index.html 2>/dev/null && echo "dist/index.html EXISTS" || echo "dist/index.html MISSING!"
        echo "=== dist/index.html content (first 5 lines) ==="
        head -5 dist/index.html 2>/dev/null || echo "Cannot read dist/index.html"
        # 上传dist目录（构建产物）
        if [ -d "dist" ]; then
          for file in $(find dist -type f 2>/dev/null); do
            r2path=$(echo "$file" | sed 's|^dist/||')
            ct="application/octet-stream"
            case "$r2path" in
              *.html) ct="text/html; charset=utf-8" ;;
              *.css) ct="text/css; charset=utf-8" ;;
              *.js) ct="application/javascript; charset=utf-8" ;;
              *.svg) ct="image/svg+xml" ;;
              *.png) ct="image/png" ;;
              *.jpg|*.jpeg) ct="image/jpeg" ;;
              *.json) ct="application/json; charset=utf-8" ;;
            esac
            aws s3 cp "$file" "s3://$BUCKET/$r2path" --content-type "$ct" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --endpoint-url "$ENDPOINT" && echo "✅ Web: $r2path" || echo "⚠️ Failed: $r2path"
          done
        fi
        # Verify index.html was uploaded
        echo "=== Verifying index.html on R2 ==="
        aws s3 ls "s3://$BUCKET/index.html" --endpoint-url "$ENDPOINT" 2>&1 || echo "Cannot list index.html on R2"
        aws s3 cp "s3://$BUCKET/index.html" - --endpoint-url "$ENDPOINT" 2>&1 | head -5 || echo "Cannot download index.html from R2"
        # 上传public目录（HTML页面）
        if [ -d "public" ]; then
          for file in $(find public -type f ! -path '*/audio/*' 2>/dev/null); do
            r2path=$(echo "$file" | sed 's|^public/||')
            ct="application/octet-stream"
            case "$r2path" in
              *.html) ct="text/html; charset=utf-8" ;;
              *.css) ct="text/css; charset=utf-8" ;;
              *.js) ct="application/javascript; charset=utf-8" ;;
              *.svg) ct="image/svg+xml" ;;
              *.png) ct="image/png" ;;
              *.jpg|*.jpeg) ct="image/jpeg" ;;
              *.json) ct="application/json; charset=utf-8" ;;
            esac
            aws s3 cp "$file" "s3://$BUCKET/$r2path" --content-type "$ct" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --endpoint-url "$ENDPOINT" && echo "✅ Public: $r2path" || echo "⚠️ Failed: $r2path"
          done
        fi
        echo "✅ Web files uploaded to R2"
        # Purge Cloudflare cache
        if [ -n "${{ secrets.CF_API_TOKEN }}" ]; then
          ZONE_ID="${{ secrets.CF_ZONE_ID }}"
          if [ -n "$ZONE_ID" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything":true}' | head -c 300 || true
          fi
        fi

  ios-build:
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        npm install 2>&1
        echo "=== Install exit code: $? ==="
        ls node_modules/.bin/vite 2>&1 || echo "vite NOT found"

    - name: Build Web
      run: |
        set +e
        echo "=== Trying npm run build ==="
        npm run build 2>&1
        RC=$?
        echo "=== npm run build exit: $RC ==="
        if [ $RC -ne 0 ]; then
          echo "=== Falling back to npx vite build ==="
          npx --yes vite build 2>&1
          echo "=== npx vite build exit: $? ==="
        fi
        
    - name: Install Capacitor & Sync iOS
      run: |
        npm install -g @capacitor/cli
        npx cap sync ios || true
        
    - name: Install CocoaPods & tools
      run: |
        gem install cocoapods --no-document
        gem install xcpretty --no-document
        
    - name: Install pods
      working-directory: ios/App/App
      run: |
        pod install --repo-update || pod install || echo "Pod install completed with warnings"

    - name: Check signing credentials
      id: check_creds
      run: |
        HAS_P12=false
        HAS_P8=false
        if [ -n "${{ secrets.APPLE_PB_PRIVATE_KEY }}" ]; then
          # 检测是 p12 还是 p8
          FIRST_LINE=$(echo "${{ secrets.APPLE_PB_PRIVATE_KEY }}" | base64 -d 2>/dev/null | head -1 || echo "")
          if echo "$FIRST_LINE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "Detected p8 private key format"
            HAS_P8=true
          elif echo "$FIRST_LINE" | grep -q "BEGIN"; then
            echo "Detected p12/pem certificate format"
            HAS_P12=true
          else
            echo "Unknown format, trying as p12"
            HAS_P12=true
          fi
        else
          echo "No APPLE_PB_PRIVATE_KEY secret found"
        fi
        echo "has_p12=$HAS_P12" >> $GITHUB_OUTPUT
        echo "has_p8=$HAS_P8" >> $GITHUB_OUTPUT
        echo "has_team=$([ -n "${{ secrets.APPLE_TEAM_ID }}" ] && echo true || echo false)" >> $GITHUB_OUTPUT
        
    - name: Install p12 certificate
      if: steps.check_creds.outputs.has_p12 == 'true'
      run: |
        set -ex
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PW="${{ secrets.KEYCHAIN_PASSWORD }}"
        
        # Decode p12
        echo "${{ secrets.APPLE_PB_PRIVATE_KEY }}" | base64 -d -o $RUNNER_TEMP/certificate.p12
        ls -la $RUNNER_TEMP/certificate.p12
        echo "P12 file decoded: $(wc -c < $RUNNER_TEMP/certificate.p12) bytes"
        
        # Also verify with openssl
        openssl pkcs12 -in $RUNNER_TEMP/certificate.p12 -passin pass:"$KEYCHAIN_PW" -nokeys -info 2>&1 | head -5 || true
        
        # Create temp keychain
        security create-keychain -p "$KEYCHAIN_PW" $KEYCHAIN_PATH || true
        security default-keychain -s $KEYCHAIN_PATH 2>/dev/null || true
        security unlock-keychain -p "$KEYCHAIN_PW" $KEYCHAIN_PATH || true
        
        # Import p12
        security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$KEYCHAIN_PW" -A || {
          echo "WARNING: p12 import failed, trying alternative method..."
          security import $RUNNER_TEMP/certificate.p12 -k login.keychain -P "$KEYCHAIN_PW" -A || true
        }
        
        # Allow access
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" $KEYCHAIN_PATH 2>/dev/null || true
        
        echo "=== Installed identities ==="
        security find-identity -v -p codesigning 2>&1 || true

    - name: Setup App Store Connect API Key (p8)
      if: steps.check_creds.outputs.has_p8 == 'true'
      run: |
        mkdir -p ~/private_keys
        echo "${{ secrets.APPLE_PB_PRIVATE_KEY }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8
        chmod 600 ~/private_keys/AuthKey_${{ secrets.APPLE_KEY_ID }}.p8
        echo "✅ App Store Connect API key installed"

    - name: Set up Xcode project for signing
      run: |
        cd ios/App/App
        # 设置为自动签名
        /usr/libexec/PlistBuddy -c "Set :objects:00C302D0204A61630053085B:buildSettings:CODE_SIGN_STYLE Automatic" App.xcodeproj/project.pbxproj 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Set :objects:00C302D0204A61630053085B:buildSettings:DEVELOPMENT_TEAM ${{ secrets.APPLE_TEAM_ID }}" App.xcodeproj/project.pbxproj 2>/dev/null || true
        echo "✅ Signing configured with team: ${{ secrets.APPLE_TEAM_ID }}"
        
    - name: Archive iOS App
      run: |
        cd ios/App/App
        set +e
        xcodebuild archive \
          -workspace App.xcworkspace \
          -scheme App \
          -sdk iphoneos \
          -configuration Release \
          -archivePath "${{ github.workspace }}/build/App.xcarchive" \
          -destination 'generic/platform=iOS' \
          DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
          CODE_SIGN_STYLE=Automatic \
          -allowProvisioningUpdates \
          -verbose 2>&1 | tail -80
        EXIT_CODE=$?
        echo "Archive exit code: $EXIT_CODE"
        if [ $EXIT_CODE -ne 0 ]; then
          echo "⚠️ Archive failed, trying without provisioning updates..."
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "${{ github.workspace }}/build/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            -verbose 2>&1 | tail -80 || echo "Archive also failed"
        fi

    # 检查archive是否存在（用 GITHUB_OUTPUT 传递给后续步骤）
    - name: Check archive status
      id: archive_check
      if: always()
      run: |
        if [ -d "${{ github.workspace }}/build/App.xcarchive" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ Archive found, will proceed with IPA export"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ No archive found, skipping IPA export"
        fi
          
    - name: Export IPA
      if: steps.archive_check.outputs.exists == 'true'
      run: |
        # Try multiple export methods: enterprise (for in-house dist), ad-hoc, then app-store
        for METHOD in enterprise ad-hoc app-store; do
          echo "=== Trying export method: $METHOD ==="
          cat > "${{ github.workspace }}/exportOptions.plist" << PLISTEOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>method</key><string>$METHOD</string>
          <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><false/>
        </dict></plist>
        PLISTEOF
          xcodebuild -exportArchive \
            -archivePath "${{ github.workspace }}/build/App.xcarchive" \
            -exportPath "${{ github.workspace }}/build/ipa" \
            -exportOptionsPlist "${{ github.workspace }}/exportOptions.plist" \
            -allowProvisioningUpdates 2>&1 | tail -20
          if [ -d "${{ github.workspace }}/build/ipa" ] && ls "${{ github.workspace }}/build/ipa/"*.ipa 2>/dev/null; then
            echo "✅ IPA exported successfully with method: $METHOD"
            break
          else
            echo "⚠️ Export failed with method: $METHOD, trying next..."
          fi
        done
        
    - name: Find and list build products
      if: always()
      run: |
        echo "=== Archive contents ==="
        ls -la "${{ github.workspace }}/build/App.xcarchive/" 2>/dev/null || echo "No archive"
        echo "=== IPA outputs ==="
        find "${{ github.workspace }}/build" -name "*.ipa" -type f 2>/dev/null || echo "No IPA found"
        find "${{ github.workspace }}/build" -name "*.app" -type d 2>/dev/null || echo "No .app found"
      
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: yandao-ios-release
        path: |
          build/ipa/*.ipa
          build/App.xcarchive/**/*.app
        retention-days: 30
      continue-on-error: true
      
    - name: Upload iOS build to Cloudflare R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: |
        pip3 install awscli --quiet --break-system-packages 2>/dev/null || pip3 install awscli --quiet
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BUCKET="${{ secrets.R2_BUCKET }}"
        ENDPOINT="https://${{ secrets.R2_ENDPOINT }}.r2.cloudflarestorage.com"
        for ipa in $(find build -name "*.ipa" -type f 2>/dev/null); do
          NAME="yandao-${TIMESTAMP}-$(basename "$ipa")"
          aws s3 cp "$ipa" "s3://$BUCKET/ios/$NAME" \
            --endpoint-url "$ENDPOINT" && echo "✅ Uploaded $NAME" || echo "⚠️ Failed $NAME"
          # 固定latest版本
          aws s3 cp "$ipa" "s3://$BUCKET/ios/yandao-latest.ipa" \
            --endpoint-url "$ENDPOINT" && echo "✅ Updated yandao-latest.ipa" || echo "⚠️ Failed latest"
        done || echo "R2 upload skipped"

    - name: Upload web dist to Cloudflare R2 (iOS job)
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: |
        BUCKET="${{ secrets.R2_BUCKET }}"
        ENDPOINT="https://${{ secrets.R2_ENDPOINT }}.r2.cloudflarestorage.com"
        echo "=== iOS: Checking dist directory ==="
        ls -la dist/ 2>/dev/null || echo "iOS: dist/ NOT FOUND!"
        ls -la dist/index.html 2>/dev/null && echo "iOS: dist/index.html EXISTS" || echo "iOS: dist/index.html MISSING!"
        if [ -d "dist" ]; then
          for file in $(find dist -type f 2>/dev/null); do
            r2path=$(echo "$file" | sed 's|^dist/||')
            ct="application/octet-stream"
            case "$r2path" in
              *.html) ct="text/html; charset=utf-8" ;;
              *.css) ct="text/css; charset=utf-8" ;;
              *.js) ct="application/javascript; charset=utf-8" ;;
              *.svg) ct="image/svg+xml" ;;
              *.png) ct="image/png" ;;
              *.jpg|*.jpeg) ct="image/jpeg" ;;
              *.json) ct="application/json; charset=utf-8" ;;
            esac
            aws s3 cp "$file" "s3://$BUCKET/$r2path" --content-type "$ct" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --endpoint-url "$ENDPOINT" && echo "iOS Web: $r2path" || echo "iOS Failed: $r2path"
          done
        fi
        if [ -d "public" ]; then
          for file in $(find public -type f ! -path '*/audio/*' 2>/dev/null); do
            r2path=$(echo "$file" | sed 's|^public/||')
            ct="application/octet-stream"
            case "$r2path" in
              *.html) ct="text/html; charset=utf-8" ;;
              *.css) ct="text/css; charset=utf-8" ;;
              *.js) ct="application/javascript; charset=utf-8" ;;
              *.svg) ct="image/svg+xml" ;;
              *.png) ct="image/png" ;;
              *.jpg|*.jpeg) ct="image/jpeg" ;;
              *.json) ct="application/json; charset=utf-8" ;;
            esac
            aws s3 cp "$file" "s3://$BUCKET/$r2path" --content-type "$ct" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --endpoint-url "$ENDPOINT" && echo "iOS Public: $r2path" || echo "iOS Failed: $r2path"
          done
        fi
        echo "✅ iOS Web files uploaded to R2"
        # Purge Cloudflare cache
        if [ -n "${{ secrets.CF_API_TOKEN }}" ]; then
          ZONE_ID="${{ secrets.CF_ZONE_ID }}"
          if [ -n "$ZONE_ID" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything":true}' | head -c 300 || true
          fi
        fi
