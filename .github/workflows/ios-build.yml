name: iOS & Android Build

on:
  push:
    branches: [ main, new_main, master ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies & Build web
      run: |
        node -v && npm -v
        npm ci
        npm run build || npx vite build

    - name: Install Capacitor CLI & Sync
      run: |
        npm install -g @capacitor/cli
        npx cap sync android || true

    - name: Fix gradlew permission & Build APK
      run: |
        cd android
        # 确保执行权限
        chmod +x gradlew
        ls -la gradlew
        # 使用 gradle wrapper 自带 JDK，不依赖外部 Gradle
        ./gradlew assembleRelease --no-daemon --warning-mode all 2>&1 | tail -50
        echo "=== BUILD EXIT CODE: $? ==="

    - name: Find and list APKs
      if: always()
      run: |
        echo "=== Looking for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null
        ls -la android/app/build/outputs/apk/release/ 2>/dev/null || echo "Release dir not found"
        ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug dir not found"

    - name: Upload APK artifact (release)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: yandao-android-release.apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30
      continue-on-error: true

    - name: Upload APK artifact (debug, fallback)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: yandao-android-debug.apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
      continue-on-error: true

    - name: Upload to Cloudflare R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: |
        pip3 install awscli --quiet --break-system-packages 2>/dev/null || pip3 install awscli --quiet
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BUCKET="${{ secrets.R2_BUCKET }}"
        ENDPOINT="https://${{ secrets.R2_ENDPOINT }}.r2.cloudflarestorage.com"
        for apk in $(find android -name "*.apk" -type f 2>/dev/null); do
          NAME="yandao-${TIMESTAMP}-$(basename "$apk")"
          aws s3 cp "$apk" "s3://$BUCKET/android/$NAME" \
            --endpoint-url "$ENDPOINT" && echo "✅ Uploaded $NAME" || echo "⚠️ Failed $NAME"
        done || echo "R2 upload skipped (no credentials)"

  ios-build:
    runs-on: macos-14
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies & Build Web
      run: |
        npm ci
        npm run build || npx vite build

    - name: Install Capacitor & Sync iOS
      run: |
        npm install -g @capacitor/cli
        npx cap sync ios || true
        
    - name: Install CocoaPods
      run: gem install cocoapods --no-document
      
    - name: Install pods
      run: |
        cd ios/App 2>/dev/null && pod install --repo-update && cd ../.. || \
        cd ios && pod install --repo-update || echo "No Podfile"
        
    - name: Import Apple signing certs
      uses: apple-actions/import-codesign-certs@v2
      continue-on-error: true
      with:
        p8-private-key: ${{ secrets.APPLE_P8_PRIVATE_KEY || secrets.APPLE_PB_PRIVATE_KEY }}
        p8-key-id: ${{ secrets.APPLE_KEY_ID }}
        p8-issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
        keychain-password: ${{ secrets.KEYCHAIN_PASSWORD || '' }}
        team-id: ${{ secrets.APPLE_TEAM_ID }}
        
    - name: Build IPA (with signing)
      run: |
        xcodebuild -workspace ios/App/App.xcworkspace \
          -scheme App -sdk iphoneos -configuration Release \
          -archivePath build/App.xcarchive \
          -archive -allowProvisioningUpdates CODE_SIGNING_ALLOWED=YES | xcpretty || \
        xcodebuild -workspace ios/App/App.xcworkspace \
          -scheme App -sdk iphoneos -configuration Release \
          -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO | xcpretty || true
        [ -f build/App.xcarchive ] && {
          cat > ios/exportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
        <key>method</key><string>app-store</string>
        <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
        <key>signingStyle</key><string>automatic</string>
        </dict></plist>
        EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/ipa -exportOptionsPlist ios/exportOptions.plist | xcpretty || true
        }
      
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: yandao-ios-release
        path: |
          build/ipa/*.ipa
          ios/build/Build/Products/Release-iphoneos/*.app
        retention-days: 30
      continue-on-error: true
