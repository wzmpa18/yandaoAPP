<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>中医命理</title>
<style>
:root{
  --teal:#00BCB4;--bg:#F8F8F8;--white:#FFFFFF;--dark:#222222;
  --gray:#707070;--lightgray:#E5E5E5;--red:#FF3B30;--gold:#D4A056;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--dark);background:var(--bg);}
body{max-width:390px;margin:0 auto;min-height:100vh;padding-bottom:70px;}

/* 顶部栏 */
.top-bar{height:60px;background:var(--teal);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:10;}
.top-bar h1{font-size:22px;font-weight:bold;color:#fff;letter-spacing:2px;}
.top-bar .share-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer;border-radius:50%;background:rgba(255,255,255,.2);}

/* 大卡片容器 */
.big-card{background:var(--white);border-radius:12px;padding:16px;margin:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.big-card-title{font-size:18px;font-weight:bold;color:var(--dark);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.big-card-title::before{content:'';width:4px;height:18px;background:var(--teal);border-radius:2px;}

/* 小卡片网格 */
.small-card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.small-card-grid.col3{grid-template-columns:repeat(3,1fr);}
.small-card{background:var(--bg);border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;text-decoration:none;color:inherit;display:block;transition:transform .15s,box-shadow .15s;}
.small-card:active{transform:scale(.96);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.small-card .sc-icon{font-size:28px;margin-bottom:8px;display:block;}
.small-card .sc-name{font-size:14px;font-weight:600;color:var(--dark);margin-bottom:2px;}
.small-card .sc-desc{font-size:11px;color:var(--gray);line-height:1.4;}

/* 横向通栏卡片（白色底色，青绿点缀） */
.banner-card{background:var(--white);margin:0 16px 14px;padding:16px 20px;border-radius:12px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);color:inherit;}
.banner-card .bc-icon{font-size:32px;flex-shrink:0;}
.banner-card .bc-info{flex:1;}
.banner-card .bc-title{font-size:17px;font-weight:bold;color:var(--dark);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.banner-card .bc-title::before{content:'';width:4px;height:18px;background:var(--teal);border-radius:2px;}
.banner-card .bc-desc{font-size:13px;color:var(--gray);line-height:1.5;}
.banner-card .bc-arrow{font-size:22px;color:var(--teal);}

/* 底部导航 */
.bottom-nav{display:flex;background:#fff;border-top:1px solid var(--lightgray);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;z-index:100;height:60px;}
.bottom-nav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--gray);font-size:12px;transition:color .2s;}
.bottom-nav .bn-item.active{color:var(--teal);}
.bottom-nav .bn-item .bn-icon{font-size:22px;margin-bottom:2px;}

@media(max-width:480px){
  .small-card-grid{grid-template-columns:repeat(4,1fr);gap:6px;}
  .small-card{padding:10px 4px;}
  .small-card .sc-icon{font-size:22px;}
  .small-card .sc-name{font-size:12px;}
}
</style>
</head>
