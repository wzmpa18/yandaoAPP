<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>中医命理</title>
<style>
:root{
  --teal:#00BCB4;--teal-dark:#009B94;--bg:#F8F8F8;--white:#FFFFFF;
  --dark:#222222;--gray:#707070;--lightgray:#E5E5E5;
  --gold:#D4A056;--green:#34A853;--red:#EA4335;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--dark);background:var(--bg);}
body{max-width:390px;margin:0 auto;height:100vh;padding-bottom:60px;overflow:hidden;display:flex;flex-direction:column;}

/* ===== 第1部分：五运六气+子午流注 横条 ===== */
.hero-bar{
  background:linear-gradient(135deg,var(--teal),var(--teal-dark));
  padding:8px 12px;color:#fff;flex-shrink:0;
}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hero-left{display:flex;align-items:center;gap:6px;font-size:12px;}
.hero-left .hl-icon{font-size:16px;}
.hero-left .hl-text{opacity:.85;}
.hero-left .hl-val{font-weight:600;}
.hero-meridian{display:flex;align-items:center;gap:4px;font-size:12px;background:rgba(0,0,0,.18);padding:3px 8px;border-radius:12px;}
.hero-meridian .hm-icon{font-size:14px;}
.hero-meridian .hm-name{font-weight:600;}

/* ===== 第2部分：两大导航按钮 ===== */
.nav-buttons{display:flex;gap:8px;padding:8px 12px;flex-shrink:0;}
.nav-btn{
  flex:1;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  gap:8px;cursor:pointer;text-decoration:none;color:#fff;font-size:18px;font-weight:bold;
  letter-spacing:4px;transition:transform .15s;
}
.nav-btn:active{transform:scale(.96);}
.nav-btn.yixue{background:linear-gradient(135deg,#00BCB4,#009B94);}
.nav-btn.zhongyi{background:linear-gradient(135deg,#34A853,#2E7D32);}

/* ===== 黄历核心区（可滚动）===== */
.huangli-wrap{flex:1;overflow-y:auto;padding:0 12px 8px;}
.huangli-card{background:var(--white);border-radius:10px;margin-bottom:8px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.hl-title{font-size:14px;font-weight:bold;color:var(--dark);margin-bottom:6px;display:flex;align-items:center;gap:4px;}
.hl-title::before{content:'';width:3px;height:14px;background:var(--teal);border-radius:2px;}
.hl-title .hl-date{font-size:12px;color:var(--gray);font-weight:400;margin-left:auto;}

/* 地母经（黄历内嵌） */
.dimujing-inline{
  font-family:"STKaiti","KaiTi",serif;font-size:13px;line-height:1.8;
  color:#5D4037;text-align:center;background:linear-gradient(180deg,#FFF8E7,#FFF3D9);
  border-radius:6px;padding:6px 8px;margin-bottom:4px;
}
.dimujing-inline .dj-tags{font-family:inherit;font-size:11px;color:var(--red);margin-top:2px;}

/* 宜忌横排 */
.yiji-inline{display:flex;gap:8px;}
.yiji-inline .yj-col{flex:1;}
.yiji-inline .yj-head{font-size:12px;font-weight:bold;text-align:center;padding:3px;border-radius:4px;margin-bottom:4px;}
.yiji-inline .yj-head.yi{background:#E8F5E9;color:var(--green);}
.yiji-inline .yj-head.ji{background:#FFEBEE;color:var(--red);}
.yiji-inline .yj-items{font-size:12px;line-height:1.6;text-align:center;color:var(--dark);}

/* 八字对标横排 */
.sizhu-inline{display:flex;gap:4px;margin-bottom:6px;}
.sizhu-inline .sp-pill{flex:1;text-align:center;background:#F5F5F5;border-radius:6px;padding:4px 2px;}
.sizhu-inline .sp-pill .sp-label{font-size:9px;color:var(--gray);}
.sizhu-inline .sp-pill .sp-val{font-size:12px;font-weight:bold;margin-top:1px;}
.bazi-cta{text-align:center;font-size:12px;color:var(--gray);}
.bazi-cta a{color:var(--teal);font-weight:600;text-decoration:none;}

/* 彭祖百忌精简 */
.pengzu-inline{font-size:11px;color:var(--gray);line-height:1.5;padding-top:6px;border-top:1px solid #F0F0F0;margin-top:6px;}
.pengzu-inline strong{color:var(--dark);}

/* ===== 底部导航 ===== */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:390px;height:60px;background:#fff;
  display:flex;border-top:1px solid var(--lightgray);z-index:100;
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;text-decoration:none;color:var(--gray);font-size:11px;cursor:pointer;
}
.bn-item.active{color:var(--teal);}
.bn-item .bn-icon{font-size:22px;line-height:1;}
</style>
</head>
<body>

<!-- ===== 第1部分：五运六气+子午流注 横条 ===== -->
<div class="hero-bar">
  <div class="hero-row">
    <div class="hero-left">
      <span class="hl-icon">📅</span>
      <span class="hl-text" id="todayDate"></span>
      <span class="hl-val">水运太过 · 少阴君火司天</span>
    </div>
    <div class="hero-meridian">
      <span class="hm-icon" id="meridianIcon">🫀</span>
      <span class="hm-name" id="meridianName">心经当令</span>
    </div>
  </div>
</div>

<!-- ===== 第2部分：两大导航按钮 ===== -->
<div class="nav-buttons">
  <a class="nav-btn yixue" href="yixue.html">易学</a>
  <a class="nav-btn zhongyi" href="zhongyi-zone.html">中医</a>
</div>

<!-- ===== 第3部分：黄历核心区 ===== -->
<div class="huangli-wrap">

  <!-- 黄历主体 -->
  <div class="huangli-card">
    <div class="hl-title">黄历 <span class="hl-date" id="ganzhiDate">丙午年 甲午月 辛未日</span></div>

    <!-- 地母经（内嵌黄历） -->
    <div class="dimujing-inline">
      丙午年来大水淹，高低禾稻总皆空<br>饥荒亦是当年定，疾病逢秋害老翁
      <div class="dj-tags">⚠ 水患 · 秋季防病</div>
    </div>

    <!-- 今日宜忌 -->
    <div class="yiji-inline" style="margin-top:8px;">
      <div class="yj-col">
        <div class="yj-head yi">宜</div>
        <div class="yj-items">祭祀 祈福 开光<br>出行 解除 沐浴</div>
      </div>
      <div class="yj-col">
        <div class="yj-head ji">忌</div>
        <div class="yj-items">动土 破土 嫁娶<br>安葬 行丧 开渠</div>
      </div>
    </div>

    <!-- 彭祖百忌 -->
    <div class="pengzu-inline">
      <strong>彭祖百忌：</strong>辛不合酱主人不尝，未不服药毒气入肠　
      <strong>胎神：</strong>厨灶炉外东北　
      <strong>二十八宿：</strong>尾星造作益荣昌
    </div>
  </div>

  <!-- 八字对标 -->
  <div class="huangli-card">
    <div class="hl-title">今日运势对标</div>
    <div class="sizhu-inline">
      <div class="sp-pill"><div class="sp-label">流年</div><div class="sp-val">丙午</div></div>
      <div class="sp-pill"><div class="sp-label">流月</div><div class="sp-val">甲午</div></div>
      <div class="sp-pill"><div class="sp-label">流日</div><div class="sp-val">辛未</div></div>
      <div class="sp-pill"><div class="sp-label">建除</div><div class="sp-val">危日</div></div>
    </div>
    <div class="bazi-cta">未排八字 · <a href="paiban/bazi-demo.html">点击排盘获取个性化运势</a></div>
  </div>

</div>

<!-- ===== 底部导航 ===== -->
<div class="bottom-nav">
  <a class="bn-item active" href="index.html">
    <span class="bn-icon">🏠</span><span>主页</span>
  </a>
  <a class="bn-item" href="ai.html">
    <span class="bn-icon">🤖</span><span>AI</span>
  </a>
  <a class="bn-item" href="#" onclick="alert('消息功能开发中');return false;">
    <span class="bn-icon">💬</span><span>信息</span>
  </a>
  <a class="bn-item" href="profile.html">
    <span class="bn-icon">👤</span><span>个人中心</span>
  </a>
</div>

<script>
(function(){
  var now = new Date();
  var months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var days = ['周日','周一','周二','周三','周四','周五','周六'];
  document.getElementById('todayDate').textContent =
    now.getFullYear()+'.'+(now.getMonth()+1)+'.'+now.getDate()+' '+days[now.getDay()];
})();

(function(){
  var meridians = [
    {name:'胆经',icon:'🫀'},{name:'肝经',icon:'🌿'},{name:'肺经',icon:'🫁'},
    {name:'大肠经',icon:'💧'},{name:'胃经',icon:'🍚'},{name:'脾经',icon:'💪'},
    {name:'心经',icon:'🫀'},{name:'小肠经',icon:'🍎'},{name:'膀胱经',icon:'💧'},
    {name:'肾经',icon:'🫘'},{name:'心包经',icon:'🎵'},{name:'三焦经',icon:'🌙'}
  ];
  var h = new Date().getHours();
  var idx = Math.floor((h + 1) / 2) % 12;
  var m = meridians[idx];
  document.getElementById('meridianName').textContent = m.name + '当令';
  document.getElementById('meridianIcon').textContent = m.icon;
})();
</script>

<link rel="stylesheet" href="utils/feedback.css">
<script src="utils/feedback.js"></script>
<script src="utils/ai-config.js"></script>
</body>
</html>
