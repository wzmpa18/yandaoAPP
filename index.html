<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>中医命理</title>
<style>
:root{
  --teal:#00BCB4;--teal-dark:#009B94;--bg:#F8F8F8;--white:#FFFFFF;
  --dark:#222222;--gray:#707070;--lightgray:#E5E5E5;
  --gold:#D4A056;--green:#34A853;--red:#EA4335;
  --wood:#34A853;--fire:#EA4335;--earth:#A67C52;--metal:#F1B232;--water:#2368B2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--dark);background:var(--bg);}
body{max-width:390px;margin:0 auto;height:100vh;padding-bottom:60px;overflow:hidden;display:flex;flex-direction:column;}

/* ===== 顶部搜索栏 ===== */
.top-bar{
  background:var(--teal);padding:8px 12px;flex-shrink:0;
  display:flex;align-items:center;gap:8px;
}
.search-box{
  flex:1;background:rgba(255,255,255,.9);border-radius:20px;
  height:34px;display:flex;align-items:center;padding:0 12px;gap:6px;
}
.search-box .sb-icon{font-size:14px;color:var(--gray);}
.search-box .sb-text{font-size:13px;color:#999;}
.top-bar .tb-date{font-size:12px;color:#fff;flex-shrink:0;}

/* ===== 五运六气+子午流注 数据条 ===== */
.data-row{
  display:flex;gap:6px;padding:6px 12px;flex-shrink:0;
}
.data-card{
  flex:1;background:#fff;border-radius:8px;padding:6px 8px;box-shadow:0 1px 3px rgba(0,0,0,.05);
  display:flex;align-items:center;gap:6px;
}
.data-card .dc-icon{font-size:18px;flex-shrink:0;}
.data-card .dc-body{flex:1;min-width:0;}
.data-card .dc-label{font-size:10px;color:var(--gray);}
.data-card .dc-val{font-size:12px;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ===== 易学/中医 两大按钮 ===== */
.nav-row{display:flex;gap:8px;padding:4px 12px 6px;flex-shrink:0;}
.nav-btn{
  flex:1;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:#fff;font-size:18px;font-weight:bold;letter-spacing:6px;
}
.nav-btn:active{transform:scale(.97);}
.nav-btn.yixue{background:linear-gradient(135deg,#00BCB4,#009B94);}
.nav-btn.zhongyi{background:linear-gradient(135deg,#34A853,#2E7D32);}

/* ===== 黄历核心区（可滚动）===== */
.huangli-area{flex:1;overflow-y:auto;padding:0 12px 6px;}
.huangli-card{
  background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.hl-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;
}
.hl-head .hl-title{font-size:14px;font-weight:bold;display:flex;align-items:center;gap:4px;}
.hl-head .hl-title::before{content:'';width:3px;height:14px;background:var(--teal);border-radius:2px;}
.hl-head .hl-gz{font-size:12px;color:var(--gray);}

/* 地母经 */
.dimujing{
  font-family:"STKaiti","KaiTi",serif;font-size:12px;line-height:1.7;color:#5D4037;
  text-align:center;background:linear-gradient(180deg,#FFF8E7,#FFF3D9);
  border-radius:6px;padding:6px;
}
.dimujing .dj-tag{font-size:10px;color:var(--red);font-family:sans-serif;margin-top:2px;}

/* 宜忌 */
.yiji{display:flex;gap:8px;margin-top:6px;}
.yiji .yj-col{flex:1;}
.yiji .yj-head{text-align:center;font-size:12px;font-weight:bold;padding:3px 0;border-radius:4px;margin-bottom:4px;}
.yiji .yj-head.yi{background:#E8F5E9;color:var(--green);}
.yiji .yj-head.ji{background:#FFEBEE;color:var(--red);}
.yiji .yj-items{font-size:11px;line-height:1.6;text-align:center;color:var(--dark);}

/* 八字对标 */
.sizhu-row{display:flex;gap:4px;margin-bottom:4px;}
.sizhu-row .sp-pill{flex:1;text-align:center;background:#F5F5F5;border-radius:6px;padding:3px 2px;}
.sizhu-row .sp-pill .sp-l{font-size:9px;color:var(--gray);}
.sizhu-row .sp-pill .sp-v{font-size:12px;font-weight:bold;}
.sizhu-row .sp-pill .sp-v.c-fire{color:var(--fire);}
.sizhu-row .sp-pill .sp-v.c-wood{color:var(--wood);}
.sizhu-row .sp-pill .sp-v.c-earth{color:var(--earth);}
.sizhu-row .sp-pill .sp-v.c-metal{color:var(--metal);}
.sizhu-row .sp-pill .sp-v.c-water{color:var(--water);}
.bazi-link{text-align:center;font-size:11px;color:var(--gray);padding:2px 0;}
.bazi-link a{color:var(--teal);font-weight:600;text-decoration:none;}

/* 彭祖 */
.pengzu{font-size:10px;color:var(--gray);line-height:1.5;padding-top:4px;border-top:1px solid #F0F0F0;margin-top:4px;}
.pengzu strong{color:var(--dark);font-size:11px;}

/* ===== 底部导航 ===== */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:390px;height:60px;background:#fff;
  display:flex;border-top:1px solid var(--lightgray);z-index:100;
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;text-decoration:none;color:var(--gray);font-size:11px;cursor:pointer;
}
.bn-item.active{color:var(--teal);}
.bn-item .bn-icon{font-size:22px;line-height:1;}
</style>
</head>
<body>

<!-- 顶部搜索栏 -->
<div class="top-bar">
  <div class="search-box">
    <span class="sb-icon">🔍</span>
    <span class="sb-text">搜索黄历/八字/经络...</span>
  </div>
  <span class="tb-date" id="tbDate"></span>
</div>

<!-- 五运六气+子午流注 数据条 -->
<div class="data-row">
  <div class="data-card">
    <span class="dc-icon">🌀</span>
    <div class="dc-body">
      <div class="dc-label">五运六气</div>
      <div class="dc-val">水运太过·少阴君火</div>
    </div>
  </div>
  <div class="data-card">
    <span class="dc-icon" id="dcMeridianIcon">🫀</span>
    <div class="dc-body">
      <div class="dc-label">子午流注</div>
      <div class="dc-val" id="dcMeridian">心经当令</div>
    </div>
  </div>
</div>

<!-- 易学/中医 两大按钮 -->
<div class="nav-row">
  <a class="nav-btn yixue" href="yixue.html">易学</a>
  <a class="nav-btn zhongyi" href="zhongyi-zone.html">中医</a>
</div>

<!-- 黄历核心区 -->
<div class="huangli-area">

  <!-- 黄历+地母经 -->
  <div class="huangli-card">
    <div class="hl-head">
      <div class="hl-title">黄历</div>
      <div class="hl-gz">丙午年 甲午月 辛未日</div>
    </div>
    <div class="dimujing">
      丙午年来大水淹，高低禾稻总皆空<br>饥荒亦是当年定，疾病逢秋害老翁
      <div class="dj-tag">⚠ 水患·秋季防病</div>
    </div>
    <div class="yiji">
      <div class="yj-col">
        <div class="yj-head yi">宜</div>
        <div class="yj-items">祭祀 祈福 开光<br>出行 解除 沐浴</div>
      </div>
      <div class="yj-col">
        <div class="yj-head ji">忌</div>
        <div class="yj-items">动土 破土 嫁娶<br>安葬 行丧 开渠</div>
      </div>
    </div>
    <div class="pengzu">
      <strong>彭祖百忌：</strong>辛不合酱主人不尝·未不服药毒气入肠　<strong>胎神：</strong>厨灶炉外东北　<strong>二十八宿：</strong>尾星造作益荣昌
    </div>
  </div>

  <!-- 八字对标 -->
  <div class="huangli-card">
    <div class="hl-head">
      <div class="hl-title">今日运势对标</div>
    </div>
    <div class="sizhu-row">
      <div class="sp-pill"><div class="sp-l">流年</div><div class="sp-v c-fire">丙午</div></div>
      <div class="sp-pill"><div class="sp-l">流月</div><div class="sp-v c-wood">甲午</div></div>
      <div class="sp-pill"><div class="sp-l">流日</div><div class="sp-v c-metal">辛未</div></div>
      <div class="sp-pill"><div class="sp-l">建除</div><div class="sp-v">危日</div></div>
    </div>
    <div class="bazi-link">未排八字·<a href="paiban/bazi-demo.html">点击排盘获取个性化运势</a></div>
  </div>

</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <a class="bn-item active" href="index.html">
    <span class="bn-icon">🏠</span><span>主页</span>
  </a>
  <a class="bn-item" href="ai.html">
    <span class="bn-icon">🤖</span><span>AI</span>
  </a>
  <a class="bn-item" href="#" onclick="alert('消息功能开发中，敬请期待');return false;">
    <span class="bn-icon">💬</span><span>信息</span>
  </a>
  <a class="bn-item" href="profile.html">
    <span class="bn-icon">👤</span><span>个人中心</span>
  </a>
</div>

<script>
(function(){
  var now=new Date();
  var d=['日','一','二','三','四','五','六'];
  document.getElementById('tbDate').textContent=(now.getMonth()+1)+'/'+now.getDate()+' 周'+d[now.getDay()];
})();
(function(){
  var m=[{n:'胆',i:'🫀'},{n:'肝',i:'🌿'},{n:'肺',i:'🫁'},{n:'大肠',i:'💧'},{n:'胃',i:'🍚'},{n:'脾',i:'💪'},{n:'心',i:'🫀'},{n:'小肠',i:'🍎'},{n:'膀胱',i:'💧'},{n:'肾',i:'🫘'},{n:'心包',i:'🎵'},{n:'三焦',i:'🌙'}];
  var h=new Date().getHours();
  var idx=Math.floor((h+1)/2)%12;
  var v=m[idx];
  document.getElementById('dcMeridian').textContent=v.n+'经当令';
  document.getElementById('dcMeridianIcon').textContent=v.i;
})();
</script>
<link rel="stylesheet" href="utils/feedback.css">
<script src="utils/feedback.js"></script>
<script src="utils/ai-config.js"></script>
</body>
</html>
