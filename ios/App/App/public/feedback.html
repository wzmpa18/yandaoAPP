<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户反馈 - 言道学外语</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            line-height: 1.6;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            background: white;
            min-height: calc(100vh - 100px);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #6366f1;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 10px;
        }
        .feedback-categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .category-btn {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 14px;
            color: #4b5563;
        }
        .category-btn:hover { border-color: #6366f1; background: #f0f0ff; }
        .category-btn.selected {
            border-color: #6366f1;
            background: linear-gradient(135deg, #667eea15, #764ba215);
            color: #6366f1;
            font-weight: 500;
        }
        .description-area {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .description-area:focus {
            outline: none;
            border-color: #6366f1;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .success-message {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        .success-message.show { display: block; }
        .success-icon { font-size: 64px; margin-bottom: 20px; }
        .success-title { font-size: 24px; margin-bottom: 15px; color: #1e293b; }
        .success-desc { color: #64748b; }
        .footer {
            text-align: center;
            padding: 20px;
            color: #9ca3af;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
            margin-top: 30px;
        }
        .footer a { color: #6366f1; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <img src="/parrot.jpg" alt="鹦鹉图标" />
        <h1>言道学外语</h1>
        <p>AI驱动的智能语言学习平台</p>
    </div>

    <div class="container">
        <a href="/app.html" class="back-link">← 返回首页</a>
        
        <div id="feedbackForm">
            <h2 style="font-size: 22px; margin-bottom: 25px; color: #1e293b;">💡 用户反馈</h2>
            
            <div class="form-group">
                <div class="form-label">请选择问题分类：</div>
                <div class="feedback-categories">
                    <button class="category-btn" data-category="功能故障">🔧 功能故障</button>
                    <button class="category-btn" data-category="功能建议">💡 功能建议</button>
                    <button class="category-btn" data-category="界面问题">🎨 界面问题</button>
                    <button class="category-btn" data-category="性能问题">⚡ 性能问题</button>
                    <button class="category-btn" data-category="内容问题">📚 内容问题</button>
                    <button class="category-btn" data-category="其他问题">📝 其他问题</button>
                </div>
            </div>

            <div class="form-group">
                <div class="form-label">请详细描述您的问题或建议：</div>
                <textarea 
                    id="description" 
                    class="description-area" 
                    placeholder="请详细描述您遇到的问题或建议，我们会认真对待每一条反馈！"></textarea>
            </div>

            <button class="submit-btn" onclick="submitFeedback()">提交反馈</button>
        </div>

        <div id="successMessage" class="success-message">
            <div class="success-icon">✅</div>
            <div class="success-title">感谢您的反馈！</div>
            <div class="success-desc">我们已经收到您的反馈，会尽快处理并回复您。</div>
        </div>

        <div class="footer">
            <p>© 2026 言道学外语</p>
            <p style="margin-top: 8px;">
                <a href="/app.html">首页</a> | 
                <a href="/contact.html">联系我们</a>
            </p>
        </div>
    </div>

    <script>
        const categories = document.querySelectorAll('.category-btn');
        let selectedCategory = '';

        categories.forEach(btn => {
            btn.addEventListener('click', () => {
                categories.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedCategory = btn.dataset.category;
            });
        });

        function submitFeedback() {
            const description = document.getElementById('description').value;
            
            if (!selectedCategory) {
                alert('请先选择问题分类');
                return;
            }
            
            if (!description.trim()) {
                alert('请输入详细描述');
                return;
            }

            document.getElementById('feedbackForm').style.display = 'none';
            document.getElementById('successMessage').classList.add('show');
        }
    </script>
</body>
</html>
