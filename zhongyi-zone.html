<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>中医工具</title>
<style>
:root{--teal:#00BCB4;--bg:#F8F8F8;--white:#FFFFFF;--dark:#222222;--gray:#707070;--lightgray:#E5E5E5;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--dark);background:var(--bg);}
body{max-width:390px;margin:0 auto;min-height:100vh;padding-bottom:70px;}

.top-bar{height:70px;background:var(--teal);display:flex;align-items:center;padding:0 16px;position:sticky;top:0;z-index:10;}
.top-bar .back-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:#fff;margin-right:12px;border:none;background:none;}
.top-bar .page-title{font-size:26px;font-weight:bold;color:#fff;}

.card-grid{display:grid;grid-template-columns:repeat(1,1fr);gap:14px;padding:14px 16px;}
.card{background:var(--white);border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px;transition:transform .15s;}
.card:active{transform:scale(.97);}
.card .card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.card .card-info{flex:1;}
.card .card-name{font-size:17px;font-weight:bold;color:var(--dark);margin-bottom:4px;}
.card .card-desc{font-size:13px;color:var(--gray);line-height:1.4;}
.card .card-arrow{color:var(--gray);font-size:18px;}

.card.jingluo .card-icon{background:#E8F5E9;color:#2E7D32;}
.card.tcm .card-icon{background:#FFEBEE;color:#C62828;}
.card.zhongyi .card-icon{background:#FFF3E0;color:#E65100;}

.bottom-nav{display:flex;background:#fff;border-top:1px solid var(--lightgray);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:390px;z-index:100;height:60px;}
.bottom-nav .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--gray);font-size:12px;text-decoration:none;}
.bottom-nav .bn-item .bn-icon{font-size:22px;margin-bottom:2px;}
.bottom-nav .bn-item:first-child{color:var(--teal);}
</style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="page-title">中医工具</span>
</div>

<div class="card-grid">
  <a class="card jingluo" href="paiban/jingluo-demo.html">
    <div class="card-icon">🧬</div>
    <div class="card-info">
      <div class="card-name">经络查询</div>
      <div class="card-desc">十二正经 · 奇经八脉 · 穴位定位 · 针灸配伍</div>
    </div>
    <span class="card-arrow">›</span>
  </a>
  <a class="card tcm" href="paiban/tcm-demo.html">
    <div class="card-icon">🌿</div>
    <div class="card-info">
      <div class="card-name">中医问诊</div>
      <div class="card-desc">中药药材 · 经典方剂 · 问诊话术 · 辨证论治</div>
    </div>
    <span class="card-arrow">›</span>
  </a>
  <a class="card zhongyi" href="paiban/zhongyi-study-demo.html">
    <div class="card-icon">📚</div>
    <div class="card-info">
      <div class="card-name">中医学习</div>
      <div class="card-desc">基础理论 · 模拟开方 · 题库考试 · 经典研读</div>
    </div>
    <span class="card-arrow">›</span>
  </a>
</div>

<div class="bottom-nav">
  <a class="bn-item" href="index.html">
    <span class="bn-icon">🏠</span><span>主页</span>
  </a>
  <a class="bn-item" href="ai.html">
    <span class="bn-icon">🤖</span><span>AI</span>
  </a>
  <a class="bn-item" href="study.html">
    <span class="bn-icon">📖</span><span>学习</span>
  </a>
  <a class="bn-item" href="profile.html">
    <span class="bn-icon">👤</span><span>个人中心</span>
  </a>
</div>


<!-- feedback system -->
<link rel="stylesheet" href="utils/feedback.css">
<script src="utils/feedback.js"></script>
</body>
</html>
