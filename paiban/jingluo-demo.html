<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>经络演示 · 2D动态</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --teal:#00BFA5;--teal-d:#00897B;--teal-bg:#E0F7FA;
  --bg:#F5EDE6;--card:#FFFDF9;--ink:#1A1A1A;--ink2:#3A3A3A;--muted:#666;--rule:#E0D8CC;
  --font-main:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --radius:12px;--shadow:0 2px 6px rgba(0,0,0,.05);
}
body{font-family:var(--font-main);background:var(--bg);color:var(--ink);font-size:14px;max-width:390px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
.header{display:flex;align-items:center;padding:0 14px;background:var(--teal);color:#FFF;min-height:44px;flex-shrink:0;position:relative}
.header .back-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;cursor:pointer;border:none;background:none;padding:0;margin-left:-14px;transition:opacity .2s}
.header .back-btn:active{opacity:.7}
.header .back-btn svg{width:22px;height:22px}
.header .title{font-size:16px;font-weight:700;margin-left:4px;letter-spacing:1px}
.header .subtitle{font-size:11px;opacity:.8;margin-left:auto}

/* SEARCH BAR */
.search-bar{display:flex;align-items:center;background:var(--card);padding:6px 12px;gap:6px;border-bottom:1px solid var(--rule);flex-shrink:0}
.search-bar input{flex:1;border:1.5px solid var(--rule);border-radius:18px;padding:5px 12px;font-size:12px;font-family:inherit;outline:none;background:var(--bg);color:var(--ink)}
.search-bar input:focus{border-color:var(--teal)}
.search-bar .sbtn{background:var(--teal);color:#FFF;border:none;border-radius:16px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap}
.search-results{max-height:200px;overflow-y:auto;background:var(--card);border-bottom:1px solid var(--rule);flex-shrink:0;display:none}
.search-results.show{display:block}
.sr-item{padding:8px 14px;font-size:12px;border-bottom:1px solid var(--rule);cursor:pointer}
.sr-item:active{background:var(--teal-bg)}
.sr-item .sr-name{font-weight:700;color:var(--teal-d)}
.sr-item .sr-meridian{font-size:10px;color:var(--muted);margin-top:2px}

/* BOTTOM NAV */
.bottom-nav{display:flex;background:var(--card);border-top:1px solid var(--rule);flex-shrink:0;padding-bottom:max(4px,env(safe-area-inset-bottom))}
.bottom-nav .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--muted);cursor:pointer;gap:2px;padding:4px 0;text-decoration:none}
.bottom-nav .nav-item.active{color:var(--teal)}
.bottom-nav .nav-item .nav-icon{font-size:18px}
.bottom-nav .nav-item .nav-ai{background:var(--teal);color:#FFF;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-top:-6px;box-shadow:0 2px 6px rgba(0,191,165,.4)}

/* MAIN CONTENT */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.canvas-wrap{flex:1;position:relative;background:var(--card);margin:10px;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-height:320px}
.canvas-wrap canvas{width:100%;height:100%;display:block}

/* MERIDIAN LIST */
.meridian-list{display:flex;overflow-x:auto;gap:6px;padding:8px 10px;background:var(--card);border-top:1px solid var(--rule);flex-shrink:0;-webkit-overflow-scrolling:touch}
.meridian-list::-webkit-scrollbar{height:0}
.meridian-chip{flex:0 0 auto;padding:6px 12px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--rule);background:var(--card);color:var(--ink2);font-family:inherit;white-space:nowrap;transition:all .2s}
.meridian-chip.active{background:var(--teal);color:#FFF;border-color:var(--teal)}
.meridian-chip.yin{color:#1976D2}
.meridian-chip.yang{color:#E53935}

/* BOTTOM PANEL */
.bottom-panel{background:var(--card);padding:10px 14px 14px;border-top:1px solid var(--rule);flex-shrink:0;max-height:200px;overflow-y:auto}
.bottom-panel .bp-title{font-size:13px;font-weight:700;color:var(--teal-d);margin-bottom:6px;letter-spacing:1px}
.bottom-panel .bp-info{font-size:12px;color:var(--ink2);line-height:1.6}
.bottom-panel .bp-points{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bottom-panel .bp-point{background:var(--teal-bg);color:var(--teal-d);font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}

/* TOAST */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#FFF;padding:10px 22px;border-radius:22px;font-size:13px;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s;max-width:90%}
.toast.show{opacity:1}

/* LEGEND */
.legend{display:flex;gap:12px;padding:6px 10px;background:var(--card);font-size:10px;color:var(--muted);justify-content:center;align-items:center;flex-wrap:wrap}
.legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.legend .dot.yin-d{background:#1976D2}.legend .dot.yang-d{background:#E53935}
.legend .dot.qi-d{background:#4CAF50;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="window.close()||history.back()">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>

</div>

/* ==================== CANVAS RENDER ==================== */
const canvas = document.getElementById('meridianCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth * devicePixelRatio;
  canvas.height = wrap.clientHeight * devicePixelRatio;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
resize();
window.addEventListener('resize', () => { resize(); draw(); });

/* ==================== BODY OUTLINE (Self-made vector) ==================== */
function drawBody() {
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  const cx = w/2, cy = h/2;
  const scale = Math.min(w/280, h/500) * 1.1;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  // Head
  ctx.beginPath();
  ctx.arc(0, -180, 28, 0, Math.PI*2);
  ctx.strokeStyle = '#3A3A3A';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Neck
  ctx.beginPath();
  ctx.moveTo(-8, -152);
  ctx.lineTo(-6, -135);
  ctx.moveTo(8, -152);
  ctx.lineTo(6, -135);
  ctx.stroke();

  // Trunk
  ctx.beginPath();
  ctx.moveTo(-6, -135);
  ctx.lineTo(-18, 50);
  ctx.lineTo(-16, 80);
  ctx.moveTo(6, -135);
  ctx.lineTo(18, 50);
  ctx.lineTo(16, 80);
  ctx.stroke();

  // Shoulder line
  ctx.beginPath();
  ctx.moveTo(-50, -130);
  ctx.lineTo(50, -130);
  ctx.strokeStyle = '#3A3A3A';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Arms
  // Left
  ctx.beginPath();
  ctx.moveTo(-50, -130);
  ctx.lineTo(-70, -80);
  ctx.lineTo(-72, -30);
  ctx.lineTo(-68, 10);
  ctx.stroke();
  // Right
  ctx.beginPath();
  ctx.moveTo(50, -130);
  ctx.lineTo(70, -80);
  ctx.lineTo(72, -30);
  ctx.lineTo(68, 10);
  ctx.stroke();

  // Hands
  ctx.beginPath();
  ctx.arc(-68, 18, 10, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(68, 18, 10, 0, Math.PI*2);
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(-16, 80);
  ctx.lineTo(-20, 160);
  ctx.lineTo(-18, 200);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(16, 80);
  ctx.lineTo(20, 160);
  ctx.lineTo(18, 200);
  ctx.stroke();

  // Feet
  ctx.beginPath();
  ctx.ellipse(-18, 210, 12, 6, 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(18, 210, 12, 6, 0, 0, Math.PI*2);
  ctx.stroke();

  // Eyes
  ctx.fillStyle = '#3A3A3A';
  ctx.beginPath();
  ctx.arc(-8, -182, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(8, -182, 2.5, 0, Math.PI*2);
  ctx.fill();

  // Mouth
  ctx.beginPath();
  ctx.arc(0, -170, 6, 0.1, Math.PI-0.1);
  ctx.strokeStyle = '#3A3A3A';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();
  return { cx, cy, scale };
}

function drawMeridian(id, cx, cy, scale, alpha = 1) {
  const m = MERIDIANS.find(m => m.id === id);
  if (!m) return;
  const pts = getMeridianPath(id, cx, cy, scale);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  // Glow
  if (activeMeridian === id) {
    ctx.shadowColor = m.color;
    ctx.shadowBlur = 8;
  }

  // Main path
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.strokeStyle = m.color;
  ctx.lineWidth = activeMeridian === id ? 3 : 1.5;
  ctx.globalAlpha = alpha;
  ctx.stroke();

  // Flowing dots
  if (activeMeridian === id || alpha > 0.5) {
    const totalLen = pts.reduce((sum, p, i) => i > 0 ? sum + Math.hypot(p.x-pts[i-1].x, p.y-pts[i-1].y) : 0, 0);
    for (let d = 0; d < 3; d++) {
      const t = ((flowPhase * 0.02 + d * 0.33) % 1);
      let target = t * totalLen;
      let acc = 0;
      for (let i = 1; i < pts.length; i++) {
        const seg = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
        if (acc + seg >= target) {
          const frac = (target - acc) / seg;
          const px = pts[i-1].x + (pts[i].x - pts[i-1].x) * frac;
          const py = pts[i-1].y + (pts[i].y - pts[i-1].y) * frac;
          ctx.beginPath();
          ctx.arc(px, py, 2.5, 0, Math.PI*2);
          ctx.fillStyle = '#4CAF50';
          ctx.globalAlpha = 0.9;
          ctx.fill();
          break;
        }
        acc += seg;
      }
    }
  }

  // Key points
  if (activeMeridian === id) {
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    for (const pt of pts) {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI*2);
      ctx.fillStyle = '#FFF';
      ctx.fill();
      ctx.strokeStyle = m.color;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  ctx.restore();
}

/* ==================== MAIN DRAW ==================== */
function draw() {
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  const { cx, cy, scale } = drawBody();

  // Draw all meridians
  MERIDIANS.forEach(m => {
    const alpha = activeMeridian ? (activeMeridian === m.id ? 1 : 0.2) : 0.5;
    drawMeridian(m.id, cx, cy, scale, alpha);
  });

  flowPhase = (flowPhase + 1) % 100;
  requestAnimationFrame(() => requestAnimationFrame(draw));
}

/* ==================== INTERACTION ==================== */
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * devicePixelRatio;
  const my = (e.clientY - rect.top) * devicePixelRatio;
  const w = canvas.width;
  const h = canvas.height;
  const cx = w/2, cy = h/2;
  const scale = Math.min(w/280, h/500) * 1.1;

  let best = null, bestDist = Infinity;
  MERIDIANS.forEach(m => {
    const pts = getMeridianPath(m.id, cx, cy, scale);
    pts.forEach(pt => {
      const sx = cx + pt.x * scale;
      const sy = cy + pt.y * scale;
      const dist = Math.hypot(mx - sx, my - sy);
      if (dist < 20 && dist < bestDist) {
        bestDist = dist;
        best = m;
      }
    });
  });

  if (best) {
    selectMeridian(best.id);
  }
});

/* ==================== MERIDIAN LIST ==================== */
function renderMeridianList() {
  const list = document.getElementById('meridianList');
  list.innerHTML = MERIDIANS.map(m => `
    <button class="meridian-chip ${m.type} ${activeMeridian === m.id ? 'active' : ''}"
            onclick="selectMeridian('${m.id}')">
      ${m.name}
    </button>
  `).join('');
}

function selectMeridian(id) {
  activeMeridian = activeMeridian === id ? null : id;
  renderMeridianList();
  updateBottomPanel();
}

function updateBottomPanel() {
  const panel = document.getElementById('bottomPanel');
  if (!activeMeridian) {
    panel.innerHTML = `
      <div class="bp-title">奇经八脉</div>
      <div class="bp-info" style="font-size:11px;line-height:1.5">
        ${QI_JING_BA_MAI.map(q => `<span style="font-weight:700;color:var(--teal-d)">${q.name}</span>：${q.desc}<br><span style="font-size:10px;color:var(--muted)">主要穴位：${q.keyPts.join('·')}</span>`).join('<br>')}
      </div>`;
    return;
  }
  const m = MERIDIANS.find(m => m.id === activeMeridian);
  panel.innerHTML = `
    <div class="bp-title" style="color:${m.color}">${m.name}（${m.hand}${m.type==='yin'?'阴':'阳'}经）</div>
    <div class="bp-info" style="font-size:11px;line-height:1.6">
      <span style="font-weight:700">所属脏腑</span>：${m.zangfu}　|　<span style="font-weight:700">五行</span>：${m.element}　|　<span style="font-weight:700">当令</span>：${m.time}<br>
      <span style="font-weight:700">穴位数</span>：${m.points}穴　|　<span style="font-weight:700">起穴</span>：${m.startPoint}　|　<span style="font-weight:700">止穴</span>：${m.endPoint}<br>
      <span style="font-weight:700">循行</span>：${m.pathDesc}<br>
      <span style="font-weight:700">主治</span>：${m.indications}
    </div>
    <div style="margin-top:6px;font-size:10px;font-weight:700;color:var(--teal-d)">主要穴位定位（点击查看详情）：</div>
    <div class="bp-points">
      ${m.keyPoints.map(p => `<span class="bp-point" onclick="showPointDetail('${m.id}','${p.name}')">${p.name}</span>`).join('')}
    </div>
    <div style="margin-top:4px;font-size:9px;color:var(--muted)">共${m.fullPoints.length}穴：${m.fullPoints.join('·')}</div>`;
}

function showPointDetail(meridianId, pointName) {
  const m = MERIDIANS.find(m => m.id === meridianId);
  if (!m) return;
  const pt = m.keyPoints.find(p => p.name === pointName);
  if (!pt) return;
  showToast(`${pt.name}穴（${m.name}）\n定位：${pt.loc}`);
}

/* ==================== SEARCH ==================== */
function handleSearch() {
  const q = document.getElementById('searchInput').value.trim();
  const results = document.getElementById('searchResults');
  if (!q) { results.classList.remove('show'); results.innerHTML = ''; return; }
  const matches = [];
  MERIDIANS.forEach(m => {
    if (m.name.includes(q) || m.zangfu.includes(q)) {
      matches.push({ type:'meridian', meridian:m, name:m.name, sub:`${m.zangfu}经 · ${m.points}穴 · 起穴${m.startPoint} · 止穴${m.endPoint}` });
    }
    m.fullPoints.forEach(pt => {
      if (pt.includes(q)) {
        const kp = m.keyPoints.find(k => k.name === pt);
        matches.push({ type:'point', meridian:m, name:pt, sub:`${m.name}` + (kp ? ' · ' + kp.loc : '') });
      }
    });
  });
  if (matches.length === 0) {
    results.innerHTML = '<div class="sr-item" style="color:var(--muted)">未找到匹配结果</div>';
  } else {
    results.innerHTML = matches.slice(0, 30).map(r => `
      <div class="sr-item" onclick="searchSelect('${r.meridian.id}','${r.name}')">
        <div class="sr-name">${r.name}</div>
        <div class="sr-meridian">${r.sub}</div>
      </div>
    `).join('');
  }
  results.classList.add('show');
}

function searchSelect(meridianId, name) {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').classList.remove('show');
  selectMeridian(meridianId);
  const m = MERIDIANS.find(m => m.id === meridianId);
  if (m) {
    const kp = m.keyPoints.find(k => k.name === name);
    if (kp) {
      setTimeout(() => showToast(`${kp.name}穴（${m.name}）\n定位：${kp.loc}`), 300);
    }
  }
}

/* ==================== INIT ==================== */
renderMeridianList();
requestAnimationFrame(draw);
</script>
